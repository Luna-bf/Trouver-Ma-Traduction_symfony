name: Deploiement du projet Trouver Ma Traduction

on: [push]

jobs:
    verification-basique:
        runs-on: windows-latest

        steps:
            - name: Recuperation du code
              uses: actions/checkout@v4

            - name: Installation de PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.4'
            
            - name: Verification de l'installation
              run: composer install --no-scripts